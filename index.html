var allRows=D.rows;
var curRecs=[];
var sortKey="l",sortAsc=true;
function rate(a,b){return b>0?+(a/b*100).toFixed(2):0;}
function lecNum(l){var m=String(l).match(/\d+/);return m?+m[0]:0;}
function uniq(a){return Array.from(new Set(a));}
function colorRate(v){if(v>=90)return'good';if(v>=70)return'mid';return'bad';}
function doQuery(){
  var name=document.getElementById('nameInput').value.trim();
  if(!name){setHint('请输入您的姓名','warn');return;}
  var recs=allRows.filter(function(r){return r.t===name;});
  if(recs.length===0){hideResult();document.getElementById('comboBox').style.display='none';setHint('未找到姓名为【'+name+'】的老师，请确认输入是否正确（注意姓名准确性）。','err');return;}
  var combos={};
  recs.forEach(function(r){combos[r.g+'|'+r.s]={g:r.g,s:r.s};});
  var comboArr=Object.keys(combos).map(function(k){return combos[k];});
  if(comboArr.length===1){
    document.getElementById('comboBox').style.display='none';
    renderResult(name,recs);
    setHint('已为您查询到【'+name+'】的讲次数据。','ok');
  }else{
    showCombo(name,recs,comboArr);
  }
}
function showCombo(name,recs,comboArr){
  hideResult();
  setHint('检测到【'+name+'】存在多名同名老师，请选择您所属的年级与科目：','warn');
  document.getElementById('comboTitle').textContent='【'+name+'】请选择您的年级 + 科目';
  var list=document.getElementById('comboList');list.innerHTML='';
  comboArr.forEach(function(c){
    var cnt=recs.filter(function(r){return r.g===c.g&&r.s===c.s;}).length;
    var el=document.createElement('div');el.className='combo-card';
    el.innerHTML='<div class="cg">'+c.g+'</div><div class="cs">'+c.s+' · '+cnt+'讲次</div>';
    el.onclick=function(){
      document.querySelectorAll('.combo-card').forEach(function(x){x.classList.remove('on');});
      el.classList.add('on');
      var sub=recs.filter(function(r){return r.g===c.g&&r.s===c.s;});
      renderResult(name+'（'+c.g+c.s+'）',sub);
      setHint('已显示【'+name+'】'+c.g+c.s+' 的讲次数据。','ok');
    };
    list.appendChild(el);
  });
  document.getElementById('comboBox').style.display='block';
}
function renderResult(title,recs){
  curRecs=recs.slice();
  var effSum=0,hwcSum=0,perfSum=0,n=recs.length;
  recs.forEach(function(r){effSum+=rate(r.eff,r.stu);hwcSum+=rate(r.hwc,r.stu);perfSum+=r.perf_coef;});
  document.getElementById('kEff').textContent=(effSum/n).toFixed(1)+'%';
  document.getElementById('kHwc').textContent=(hwcSum/n).toFixed(1)+'%';
  document.getElementById('kPerf').textContent=(perfSum/n).toFixed(2);
  document.getElementById('kr').style.display='flex';
  document.getElementById('resultTitle').innerHTML='讲次明细 <span>('+n+' 个讲次 · '+title+')</span>';
  document.getElementById('resultTitle').style.display='block';
  document.getElementById('tblWrap').style.display='block';
  drawTable();
}
function drawTable(){
  var rows=curRecs.slice();
  rows.sort(function(a,b){
    var va,vb;
    if(sortKey==='l'){va=lecNum(a.l);vb=lecNum(b.l);}
    else if(sortKey==='eff'){va=rate(a.eff,a.stu);vb=rate(b.eff,b.stu);}
    else if(sortKey==='hwc'){va=rate(a.hwc,a.stu);vb=rate(b.hwc,b.stu);}
    else{va=a.perf_coef;vb=b.perf_coef;}
    return sortAsc?va-vb:vb-va;
  });
  var tb=document.getElementById('tbody');tb.innerHTML='';
  rows.forEach(function(r){
    var eff=rate(r.eff,r.stu),hwc=rate(r.hwc,r.stu);
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+r.l+'</td><td class="'+colorRate(eff)+'">'+eff.toFixed(1)+'%</td><td class="'+colorRate(hwc)+'">'+hwc.toFixed(1)+'%</td><td>'+Number(r.perf_coef).toFixed(2)+'</td>';
    tb.appendChild(tr);
  });
  document.querySelectorAll('#headRow th').forEach(function(th){
    th.classList.remove('sorted');
    var ar=th.querySelector('.ar');ar.textContent='';
    if(th.getAttribute('data-k')===sortKey){th.classList.add('sorted');ar.textContent=sortAsc?'▲':'▼';}
  });
}
document.querySelectorAll('#headRow th').forEach(function(th){th.onclick=function(){var k=th.getAttribute('data-k');if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=true;}drawTable();};});
function hideResult(){document.getElementById('kr').style.display='none';document.getElementById('resultTitle').style.display='none';document.getElementById('tblWrap').style.display='none';document.getElementById('tbody').innerHTML='';}
function setHint(t,cls){var h=document.getElementById('hint');h.textContent=t;h.className='hint'+(cls?' '+cls:'');}
document.getElementById('nameInput').addEventListener('keydown',function(e){if(e.key==='Enter')doQuery();});
</script>
